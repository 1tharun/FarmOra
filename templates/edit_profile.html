{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<style>
  .wrap { max-width:560px; margin:3rem auto; padding:0 1.5rem; }
  .card { background:#fff; border:1.5px solid var(--parchment-dk); border-radius:12px; padding:2.5rem; box-shadow:var(--shadow-md); }
  .card-title { font-family:'Cormorant Garamond',serif; font-size:2rem; color:var(--forest); margin-bottom:1.5rem; }
  .btn-save { width:100%; padding:13px; background:linear-gradient(135deg,var(--forest),var(--forest-mid)); color:var(--gold-lt); border:none; border-radius:6px; font-family:'Jost',sans-serif; font-size:0.95rem; font-weight:600; cursor:pointer; margin-top:0.5rem; }
  .btn-save:hover { filter:brightness(1.1); }
  .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--forest); text-decoration:none; font-size:0.88rem; font-weight:600; margin-bottom:1.5rem; }
</style>
<div class="wrap">
  <a href="/profile/" class="back-link">← Back to Profile</a>
  <div class="card">
    <div class="card-title">✏️ Edit Profile</div>
    <form method="POST">
      {% csrf_token %}
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <input class="field-input" type="text" name="name" value="{{ user.name }}" required>
      </div>
      <div class="field-group">
        <label class="field-label">Mobile Number</label>
        <input class="field-input" type="tel" name="mobile_number" value="{{ user.mobile_number|default:'' }}">
      </div>
      <div class="field-group">
        <label class="field-label">Address</label>
        <textarea class="field-input" name="address" rows="3">{{ user.address|default:'' }}</textarea>
      </div>
      <div class="field-group">
        <label class="field-label">Email (cannot change)</label>
        <input class="field-input" type="email" value="{{ user.email }}" disabled style="opacity:0.6;">
      </div>
      <button type="submit" class="btn-save">Save Changes →</button>
    </form>
  </div>
</div>
{% endblock %}
